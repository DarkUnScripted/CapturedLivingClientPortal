name: Sync from PicPeak

# Captured Living fork only. Once a week (or on demand) this pushes PicPeak's
# newest main to the `sync/upstream` branch and opens a pull request into our
# main. Merging that PR with a merge commit brings in their features and fixes
# while keeping our own commits on top; the regular test and image workflows
# run on the PR and again on main after the merge.
#
# Needs the repository secret SYNC_TOKEN: a fine-grained personal access token
# for this repository with Contents, Pull requests and Workflows set to
# read/write. GITHUB_TOKEN is not enough, because upstream changes its own
# workflow files and GitHub refuses to let GITHUB_TOKEN push those (and PRs it
# opens would not trigger the test workflows).

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'DarkUnScripted/CapturedLivingClientPortal'
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: https://github.com/PicPeak/picpeak.git
      UPSTREAM_BRANCH: main
      SYNC_BRANCH: sync/upstream
      GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
    steps:
      - name: Check the token
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Add the SYNC_TOKEN repository secret (see the comment at the top of this workflow)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Fetch PicPeak
        id: fetch
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          behind=$(git rev-list --count "HEAD..upstream/$UPSTREAM_BRANCH")
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "main is $behind commit(s) behind PicPeak $UPSTREAM_BRANCH"

      - name: Push the sync branch
        if: steps.fetch.outputs.behind != '0'
        run: git push --force origin "upstream/$UPSTREAM_BRANCH:refs/heads/$SYNC_BRANCH"

      - name: Open the pull request
        if: steps.fetch.outputs.behind != '0'
        run: |
          if [[ -n "$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number')" ]]; then
            echo "A sync pull request is already open; the push above updated it."
            exit 0
          fi
          version=$(git show "upstream/$UPSTREAM_BRANCH:package.json" | jq -r .version)
          gh pr create --base main --head "$SYNC_BRANCH" \
            --title "chore(sync): merge PicPeak $version" \
            --body "Brings main up to PicPeak \`$UPSTREAM_BRANCH\` ($version), ${{ steps.fetch.outputs.behind }} new commit(s).

          Before merging:
          - Tests are green.
          - If GitHub reports conflicts, resolve them locally (see docs/CAPTURED_LIVING_FORK.md).
          - Merge with **Create a merge commit**, not squash or rebase, so the next sync starts from here.

          After merging, the image workflow publishes new \`:main\` images; deploy them on the server."
